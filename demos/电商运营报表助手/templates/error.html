{# ── 错误页面 ── #}
{# 作用：展示页面不存在或访问出错时的提示。 #}
{% extends "base.html" %}
{# 页面区块：输出当前页面的主体内容。 #}
{% block content %}
<div class="card">
  <div class="card-head"><h2>错误 {{ code }}</h2></div>
  <p class="conclusion">{{ message }}</p>
  <p><a class="btn btn-primary" href="/">返回经营总览</a></p>
</div>
{% endblock %}
